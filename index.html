<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hören">
<meta name="theme-color" content="#F3F5F7">
<title>Hören-Trainer</title>
<style>
:root{
  --paper:#F3F5F7; --card:#FFFFFF; --ink:#152238; --cell:#274C77; --cell-2:#1B3657;
  --frame:#C9D2DC; --muted:#5E6B7C; --sun:#F2B544; --sun-soft:#FCEFD2; --ok:#2E7D5B; --warn:#B4442F;
  --serif: Charter, "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.fa{direction:rtl;text-align:right;font-family:var(--sans)}

/* ---------- library ---------- */
#lib{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(var(--safe-b) + 40px)}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand h1{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.05;margin:0;letter-spacing:-.01em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:15px}
.linkbtn{background:none;border:0;color:var(--cell);font-weight:600;padding:8px 0;font-size:15px}
.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--cell);color:#fff;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:600}
.primary:active{background:var(--cell-2)}
.secondary{background:var(--card);border:1.5px solid var(--frame);color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px}
.tabs{display:flex;gap:6px;margin:26px 0 12px;border-bottom:1.5px solid var(--frame)}
.tabs button{background:none;border:0;padding:10px 4px;margin-right:14px;font-size:16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--sun)}
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:1px solid #E1E6EC}
.rec .name{font-weight:600;font-size:17px;border:0;background:none;text-align:left;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .meta{grid-column:1;font-size:14px;color:var(--muted)}
.rec .acts{grid-row:1/3;grid-column:2;display:flex;gap:4px;align-items:center}
.icon{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon:active{background:#E7ECF1}
.empty{border:1.5px dashed var(--frame);border-radius:14px;padding:22px;color:var(--muted);line-height:1.6}
.vocab{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid #E1E6EC}
.vocab b{font-size:17px}
.vocab .fa{font-size:15px;margin-top:2px}
.vocab .en{color:var(--muted);font-size:14px}
.vocab .ctx{font-family:var(--serif);font-size:14px;color:var(--muted);margin-top:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- player ---------- */
#player{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;background:var(--paper);border-bottom:1px solid #DDE3EA}
.topbar h2{flex:1;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tx{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px 40px;max-width:760px;width:100%;margin:0 auto;scroll-padding:30vh}
.seg{position:relative;font-family:var(--serif);font-size:20px;line-height:1.62;margin:0 0 14px;padding:4px 0 4px 14px;border-left:3px solid transparent;border-radius:2px}
.seg .ts{display:block;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;padding:0 0 2px;font-variant-numeric:tabular-nums}
.seg.cur{border-left-color:var(--sun);background:linear-gradient(90deg,var(--sun-soft),rgba(252,239,210,0) 85%)}
.w{cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:rgba(242,181,68,.35)}
.w.now{background:var(--sun);color:var(--ink);box-shadow:0 0 0 2px var(--sun)}
.tx.m-hide .seg:not(.rev) .txt,.tx.m-after .seg:not(.rev) .txt{filter:blur(7px);user-select:none;-webkit-user-select:none}
.tx.m-hide .seg:not(.rev)::after,.tx.m-after .seg:not(.rev)::after{content:"Tippen zum Aufdecken";position:absolute;left:14px;bottom:8px;font:600 12px var(--sans);color:var(--cell);opacity:.8}
.alt{font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--muted);margin-top:6px;padding:6px 10px;background:#EAEFF4;border-radius:8px}
.alt .altl{display:block;font:600 11px var(--sans);color:var(--cell);margin-bottom:2px}
.alt .use{float:right;margin:-2px -4px 0 8px;border:1.5px solid var(--frame);background:var(--card);border-radius:999px;padding:3px 10px;font:600 12px var(--sans);color:var(--cell)}
.tx.m-hide .seg:not(.rev) .alt,.tx.m-after .seg:not(.rev) .alt{display:none}
.st-cat{font-family:var(--serif);font-size:21px;margin:22px 0 8px}
.st{background:var(--card);border:1px solid #E1E6EC;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.st.none{opacity:.55}
.st .pat{font-family:var(--serif);font-size:17px;font-weight:700}
.st .fa{font-size:15px;margin-top:3px}
.st .ex{font-size:13px;color:var(--muted);margin-top:4px;font-style:italic}
.st .cnt{font:700 12px var(--sans);color:var(--cell);background:#EAEFF4;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st .hit{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding-top:8px;border-top:1px solid #EEF1F4;font-family:var(--serif);font-size:15px;line-height:1.45}
.st .hit button{flex:none;border:1.5px solid var(--frame);background:var(--paper);border-radius:999px;width:34px;height:30px;font-size:12px}
.st .hit small{display:block;font:600 11px var(--sans);color:var(--muted)}
.st mark{background:var(--sun-soft);box-shadow:inset 0 -2px 0 var(--sun);color:inherit;padding:0 1px}
.stchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.stchips span{font:600 12px var(--sans);background:#EAEFF4;color:var(--cell);border-radius:999px;padding:4px 10px}
.notx{max-width:520px;margin:10vh auto 0;text-align:center;color:var(--muted);line-height:1.6}
.notx h3{font-family:var(--serif);color:var(--ink);font-size:24px;margin:0 0 8px}

/* shadow card */
.shadow{display:none;padding:14px 18px;background:var(--card);border-top:1px solid #DDE3EA}
.shadow.on{display:block}
.shadow .phase{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.shadow .phase .you{color:var(--ok)}
.shadow .bar{height:5px;background:#E6EBF0;border-radius:3px;margin:8px 0 10px;overflow:hidden}
.shadow .bar i{display:block;height:100%;width:0;background:var(--cell)}
.shadow.gap .bar i{background:var(--ok)}
.shadow .opts{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--frame);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* dock */
.dock{background:var(--cell-2);color:#fff;padding:10px 14px calc(var(--safe-b) + 10px)}
.scrub{position:relative;height:34px;touch-action:none}
.scrub .rail{position:absolute;left:0;right:0;top:15px;height:4px;background:rgba(255,255,255,.22);border-radius:2px}
.scrub .fill{position:absolute;left:0;top:15px;height:4px;background:var(--sun);border-radius:2px}
.scrub .ticks{position:absolute;left:0;right:0;top:11px;height:12px;pointer-events:none}
.scrub .ticks i{position:absolute;top:0;width:1px;height:12px;background:rgba(255,255,255,.28)}
.scrub .knob{position:absolute;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.times{display:flex;justify-content:space-between;font-size:12px;opacity:.8;font-variant-numeric:tabular-nums;margin-top:-4px}
.transport{display:flex;justify-content:center;align-items:center;gap:14px;margin:4px 0 10px}
.transport button{background:none;border:0;color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative}
.transport button:active{background:rgba(255,255,255,.12)}
.transport .skip small{position:absolute;left:50%;top:50%;transform:translate(-50%,-44%);font-size:9.5px;font-weight:800;pointer-events:none}
.transport .play{width:66px;height:66px;background:var(--sun);color:var(--ink)}
.transport .play:active{background:#E3A42E}
.tools{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.tool[aria-pressed=true]{background:#fff;color:var(--cell-2);border-color:#fff}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(21,34,56,.38);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;max-height:86vh;overflow-y:auto;padding:10px 20px calc(var(--safe-b) + 22px);max-width:720px;margin:0 auto;box-shadow:0 -8px 30px rgba(21,34,56,.18);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--frame);margin:0 auto 12px}
.sheet h3{font-family:var(--serif);font-size:24px;margin:4px 0 10px}
.sheet h4{font-size:14px;color:var(--muted);margin:18px 0 8px;font-weight:600}
.sheet label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--frame);border-radius:12px;margin-bottom:8px}
.sheet label.opt:has(input:checked){border-color:var(--cell);background:#EEF3F8}
.sheet label.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sheet input[type=range]{width:100%;accent-color:var(--cell)}
.sheet input[type=text],.sheet input[type=password],.sheet textarea{width:100%;border:1.5px solid var(--frame);border-radius:10px;padding:10px;font-size:16px;background:var(--paper)}
.progress{height:8px;background:#E6EBF0;border-radius:4px;overflow:hidden;margin:12px 0 6px}
.progress i{display:block;height:100%;width:0;background:var(--cell);transition:width .3s}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.word{font-family:var(--serif);font-size:30px;font-weight:700;margin:0}
.lemma{color:var(--muted);font-size:14px}
.tr{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--paper)}
.tr .fa{font-size:20px;font-weight:600}
.tr .en{font-size:16px;color:var(--muted);margin-top:4px}
.dict{font-size:14px;line-height:1.55;margin-top:6px}
.ctxs{font-family:var(--serif);font-size:17px;line-height:1.5;border-left:3px solid var(--sun);padding-left:12px;margin:10px 0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--cell);font-weight:600;font-size:14px;text-decoration:none;border:1.5px solid var(--frame);border-radius:999px;padding:6px 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 190px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw}
.help{line-height:1.8;font-size:15px}
.help ol{padding-right:20px;padding-left:0}
</style>
</head>
<body>

<!-- ================= LIBRARY ================= -->
<main id="lib">
  <div class="brand">
    <div>
      <h1>Hören-Trainer</h1>
      <p>Meeting-Aufnahmen hören, verstehen, nachsprechen.</p>
    </div>
    <div class="row" style="gap:14px"><button class="linkbtn" id="glossBtn">Fachwörter</button><button class="linkbtn" id="helpBtn">راهنما</button></div>
  </div>
  <button class="primary" id="addBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Aufnahme hinzufügen
  </button>
  <input type="file" id="fileIn" accept="audio/*,.m4a,.mp3,.wav,.aac,.caf,.mp4" multiple hidden>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="recs">Aufnahmen</button>
    <button role="tab" aria-selected="false" data-tab="words">Wortliste</button>
    <button role="tab" aria-selected="false" data-tab="structs">Strukturen</button>
  </div>
  <section id="recList"></section>
  <section id="wordList" hidden></section>
  <section id="structList" hidden></section>
</main>

<!-- ================= PLAYER ================= -->
<div id="player" hidden>
  <div class="topbar">
    <button class="icon" id="backBtn" aria-label="Zurück"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="pTitle"></h2>
    <button class="icon" id="txBtn" aria-label="Transkript"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 11h16M4 16h10"/></svg></button>
  </div>
  <div class="tx" id="tx"></div>
  <div class="shadow" id="shadowCard">
    <div class="phase"><span id="shPhase">Hör zu</span><span id="shCount" style="font-weight:600;color:var(--muted);font-size:14px"></span></div>
    <div class="bar"><i id="shBar"></i></div>
    <div class="opts">
      <button class="chip" id="shGap">Pause ×1.2</button>
      <button class="chip" id="shReps">Wiederholen 1×</button>
      <button class="chip" id="shRec" aria-pressed="false">Mich aufnehmen</button>
    </div>
  </div>
  <div class="dock">
    <div class="scrub" id="scrub"><div class="rail"></div><div class="ticks" id="ticks"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="transport">
      <button class="skip" id="b10" aria-label="10 Sekunden zurück"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 3v4h4"/></svg><small id="b10l">10</small></button>
      <button class="skip" id="b5" aria-label="5 Sekunden zurück"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 3v4h4"/></svg><small id="b5l">5</small></button>
      <button class="play" id="playBtn" aria-label="Abspielen"><svg id="icoPlay" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg><svg id="icoPause" hidden width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg></button>
      <button class="skip" id="f5" aria-label="5 Sekunden vor"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v4h-4"/></svg><small id="f5l">5</small></button>
      <button class="skip" id="f10" aria-label="10 Sekunden vor"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v4h-4"/></svg><small id="f10l">10</small></button>
    </div>
    <div class="tools">
      <button class="tool" id="speedBtn">1.0×</button>
      <button class="tool" id="modeBtn" aria-pressed="false">Shadowing</button>
      <button class="tool" id="loopBtn" aria-pressed="false">Satz wiederholen</button>
      <button class="tool" id="textBtn">Text: sichtbar</button>
      <button class="tool" id="soundBtn">Klang</button>
    </div>
  </div>
  <audio id="audio" preload="auto" playsinline></audio>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* =========================================================
   Hören-Trainer — single-file web app (iPhone / iPad / Mac)
   Data stays on the device (IndexedDB). No server.
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => { if(!isFinite(t)) t = 0; t = Math.max(0, t); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = Math.floor(t%60); return (h? h+':'+String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, ms); }

/* ---------- settings ---------- */
const DEF = {rate:1, enh:true, boost:1.4, textMode:'show', gap:1.2, reps:1, rec:false, method:'local', model:'onnx-community/whisper-small', gpu:false, key:''};
let S = Object.assign({}, DEF);
try { Object.assign(S, JSON.parse(localStorage.getItem('ht-settings')||'{}')); } catch(e){}
const saveS = () => { try{ localStorage.setItem('ht-settings', JSON.stringify(S)); }catch(e){} };

/* ---------- IndexedDB ---------- */
const DB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r = indexedDB.open('hoeren-trainer', 1);
    r.onupgradeneeded = () => { const d=r.result; d.createObjectStore('recs',{keyPath:'id'}); d.createObjectStore('audio',{keyPath:'id'}); d.createObjectStore('vocab',{keyPath:'id'}); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(store, mode, fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode); const st=t.objectStore(store); const r=fn(st); t.oncomplete=()=>res(r && r.result); t.onerror=()=>rej(t.error); }); },
  put(store,obj){ return this.tx(store,'readwrite',s=>s.put(obj)); },
  get(store,key){ return this.tx(store,'readonly',s=>s.get(key)); },
  all(store){ return this.tx(store,'readonly',s=>s.getAll()); },
  del(store,key){ return this.tx(store,'readwrite',s=>s.delete(key)); }
};

/* ---------- state ---------- */
const audio = $('#audio');
let cur = null;          // current rec metadata
let segs = [];           // [{s,e,t}]
let curSeg = -1;
let loopOn = false;
let userScrollT = 0;

/* =========================================================
   LIBRARY
   ========================================================= */
async function renderLib(){
  const recs = (await DB.all('recs')).sort((a,b)=>b.created-a.created);
  const el = $('#recList');
  if(!recs.length){
    el.innerHTML = `<div class="empty">Noch keine Aufnahmen. Tippe auf <b>Aufnahme hinzufügen</b> und wähle eine Datei aus der App „Dateien“.<div class="fa" style="margin-top:10px">هنوز فایلی نیست. اول ویس را از Voice Memos با Share → Save to Files ذخیره کن، بعد اینجا اضافه‌اش کن. (راهنما بالا)</div></div>`;
    return;
  }
  el.innerHTML = recs.map(r => {
    let st = 'kein Transkript';
    if(r.segments && r.segments.length){ st = (r.tDone && r.duration && r.tDone < r.duration - 1) ? `Transkript ${Math.round(r.tDone/r.duration*100)} %` : `Transkript ✓ (${r.segments.length} Sätze)`; }
    return `<div class="rec" data-id="${r.id}">
      <button class="name" data-act="open">${esc(r.name)}</button>
      <div class="meta">${fmt(r.duration||0)} &nbsp;|&nbsp; ${st}${r.pos>5?' &nbsp;|&nbsp; bei '+fmt(r.pos):''}</div>
      <div class="acts">

      let dur = 0;
      try{ dur = await probeDuration(f); }
      catch(e1){ // second try: full decode (some players can't read metadata)
        const AC = window.AudioContext||window.webkitAudioContext; const c = new AC();
        try{ dur = (await c.decodeAudioData(await f.arrayBuffer())).duration; } finally { try{ c.close(); }catch(_){} }
      }
      const id = uid();
      await DB.put('audio', {id, blob:f});
      await DB.put('recs', {id, name:f.name.replace(/\.[^.]+$/,''), type:f.type, size:f.size, created:Date.now(), duration:dur, pos:0, segments:[], tDone:0});

function probeDuration(blob){
  return new Promise((res,rej)=>{
    const a = new Audio(); const u = URL.createObjectURL(blob); let done=false;
    const fin = (v,err) => { if(done) return; done=true; URL.revokeObjectURL(u); err? rej(err):res(v); };
    a.preload='metadata'; a.onloadedmetadata = () => {
      if(isFinite(a.duration) && a.duration>0) fin(a.duration);
      else { a.currentTime = 1e7; a.ontimeupdate = () => { a.ontimeupdate=null; fin(a.duration||0); }; }
    };
    a.onerror = () => fin(0, new Error('Format wird nicht unterstützt'));
    setTimeout(()=>fin(0), 8000);
    a.src = u;
  });
}

/* ---------- audio graph: speed + clarity ---------- */
let ctx=null, nodes=null;
function ensureGraph(){
  if(ctx) return;
  try{
    if(navigator.audioSession) navigator.audioSession.type = 'playback'; // plays even with the silent switch on (iOS 17+)
    const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC();
    const src = ctx.createMediaElementSource(audio);
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=95; hp.Q.value=0.7;
    const mud = ctx.createBiquadFilter(); mud.type='peaking'; mud.frequency.value=280; mud.Q.value=1.0; mud.gain.value=-3;
    const pres = ctx.createBiquadFilter(); pres.type='peaking'; pres.frequency.value=2900; pres.Q.value=0.9; pres.gain.value=6;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9500; lp.Q.value=0.7;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value=-32; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.004; comp.release.value=0.2;
    const makeup = ctx.createGain(); makeup.gain.value = 1.8;
    const boost = ctx.createGain();
    nodes = {src,hp,mud,pres,lp,comp,makeup,boost};
    wireGraph();
  }catch(err){ ctx=null; nodes=null; console.warn('graph', err); }
}
function wireGraph(){
  if(!nodes) return; const n = nodes;
  Object.values(n).forEach(x=>{ try{x.disconnect()}catch(e){} });
  if(S.enh){ n.src.connect(n.hp); n.hp.connect(n.mud); n.mud.connect(n.pres); n.pres.connect(n.lp); n.lp.connect(n.comp); n.comp.connect(n.makeup); n.makeup.connect(n.boost); }
  else n.src.connect(n.boost);
  n.boost.gain.value = S.boost; n.boost.connect(ctx.destination);
}
function applySettings(){
  audio.preservesPitch = true; audio.webkitPreservesPitch = true; audio.mozPreservesPitch = true;
  audio.defaultPlaybackRate = S.rate; audio.playbackRate = S.rate;
  $('#speedBtn').textContent = (Math.round(S.rate*100)/100).toFixed(2).replace(/0$/,'') + '×';
  $('#textBtn').textContent = 'Text: ' + ({show:'sichtbar', hide:'verborgen', after:'nach dem Hören'}[S.textMode]);
  $('#tx').className = 'tx m-' + S.textMode;
  $('#soundBtn').textContent = S.enh ? 'Klang: klar' : 'Klang: original';
  $('#soundBtn').setAttribute('aria-pressed', S.enh);
  $('#shGap').textContent = 'Pause ×' + S.gap.toFixed(1);
  $('#shReps').textContent = 'Wiederholen ' + S.reps + '×';
  $('#shRec').setAttribute('aria-pressed', S.rec);
  wireGraph();
}

  try{ await audio.play(); }catch(err){ toast('Wiedergabe nicht möglich: '+err.message); }

/* scrubber */
(function(){
  const sc = $('#scrub'); let drag=false;
  const at = e => { const r = sc.getBoundingClientRect(); const x = (e.touches? e.touches[0].clientX : e.clientX) - r.left; return Math.max(0, Math.min(1, x/r.width)) * (audio.duration||0); };
  const down = e => { drag=true; seekTo(at(e)); e.preventDefault(); };
  const move = e => { if(drag){ seekTo(at(e)); e.preventDefault(); } };
  const up = () => { if(drag){ drag=false; if(shadow.on){ const i = segAt(audio.currentTime); if(i>=0) startShadowAt(i); } } };
  sc.addEventListener('pointerdown', down); window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
})();

/* ---------- time loop ---------- */
function segAt(t){ let lo=0, hi=segs.length-1, ans=-1; while(lo<=hi){ const m=(lo+hi)>>1; if(segs[m].s <= t+0.05){ ans=m; lo=m+1; } else hi=m-1; } return ans; }
function updateTime(){
  const d = audio.duration||0, t = audio.currentTime||0, p = d? t/d*100 : 0;
  $('#fill').style.width = p+'%'; $('#knob').style.left = p+'%';
  $('#tCur').textContent = fmt(t); $('#tDur').textContent = fmt(d);
}
function tick(){
  requestAnimationFrame(tick);
  if($('#player').hidden) return;
  updateTime();
  if(!segs.length) return;
  const t = audio.currentTime;
  if(loopOn && !shadow.on && curSeg>=0 && t >= segs[curSeg].e - 0.03 && !audio.paused){ audio.currentTime = segs[curSeg].s; return; }
  if(shadow.on) shadowTick(t);
  let i = loopOn && curSeg>=0 ? curSeg : segAt(t);
  if(shadow.on) i = shadow.i;
  if(i !== curSeg || !tick._el){
    const prev = document.querySelector('.seg.cur'); if(prev){ prev.classList.remove('cur'); if(S.textMode==='after' && !audio.paused) prev.classList.add('rev'); }
    curSeg = i; tick._el = i>=0 ? document.querySelector(`.seg[data-i="${i}"]`) : null;
    if(tick._el){ tick._el.classList.add('cur'); if(Date.now()-userScrollT > 3500) tick._el.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
  }
  // approximate current word
  const el = tick._el; if(!el || i<0) return;
  const g = segs[i]; const ws = el.querySelectorAll('.txt .w'); if(!ws.length) return;
  let k = -1;
  if(t >= g.s && t <= g.e){
    const lens = [...ws].map(w=>w.textContent.length+1); const tot = lens.reduce((a,b)=>a+b,0);
    let target = (t-g.s)/Math.max(0.1,g.e-g.s)*tot, acc=0; k = ws.length-1;
    for(let j=0;j<lens.length;j++){ acc+=lens[j]; if(acc>=target){ k=j; break; } }
  }
  if(k !== tick._w || el !== tick._wel){ const o = document.querySelector('.w.now'); if(o) o.classList.remove('now'); if(k>=0) ws[k].classList.add('now'); tick._w = k; tick._wel = el; }
}
requestAnimationFrame(tick);

/* =========================================================
   SHADOWING
   ========================================================= */
const shadow = {on:false, i:0, rep:0, phase:'idle', paused:false, timer:null, gapStart:0, gapLen:0, raf:null, mic:null, rec:null, chunks:[], own:null};
$('#modeBtn').onclick = () => {
  if(!segs.length){ toast('Shadowing braucht ein Transkript. Erstelle es zuerst.'); openTxSheet(); return; }
  setMode(!shadow.on);
  if(shadow.on){ const i = Math.max(0, segAt(audio.currentTime)); startShadowAt(i); }
};
function setMode(on){
  if(!on) stopShadow();
  shadow.on = on; $('#modeBtn').setAttribute('aria-pressed', on);
  $('#shadowCard').classList.toggle('on', on);
  $('#b10l').textContent = on ? '◂◂' : '10'; $('#b5l').textContent = on ? '↺' : '5';
  $('#f5l').textContent = on ? '▸▸' : '5';  $('#f10l').textContent = on ? '▸▸' : '10';
  $('#b10').setAttribute('aria-label', on? 'Vorheriger Satz':'10 Sekunden zurück');
  $('#b5').setAttribute('aria-label', on? 'Satz nochmal':'5 Sekunden zurück');
  $('#f5').setAttribute('aria-label', on? 'Nächster Satz':'5 Sekunden vor');
  $('#f10').setAttribute('aria-label', on? 'Nächster Satz':'10 Sekunden vor');
}
function clearShadowTimers(){ clearTimeout(shadow.timer); cancelAnimationFrame(shadow.raf); if(shadow.own){ shadow.own.pause(); shadow.own=null; } }
function stopShadow(){ clearShadowTimers(); stopRecording(true); shadow.phase='idle'; shadow.paused=false; audio.pause(); }
function startShadowAt(i){
  clearShadowTimers(); stopRecording(true);
  shadow.i = i; shadow.rep = 0; shadow.paused = false; playShadowSeg();
}
function playShadowSeg(){
  const g = segs[shadow.i]; if(!g){ stopShadow(); setShPhase('Fertig! Alle Sätze geschafft.', ''); return; }
  shadow.phase = 'play'; $('#shadowCard').classList.remove('gap');
  setShPhase('Hör zu', `Satz ${shadow.i+1} / ${segs.length}` + (S.reps>1?`  (${shadow.rep+1}/${S.reps})`:''));
  audio.currentTime = g.s; play();
}
function shadowTick(t){
  if(shadow.phase!=='play' || shadow.paused) return;
  const g = segs[shadow.i];
  $('#shBar').style.width = Math.min(100, Math.max(0,(t-g.s)/Math.max(.1,g.e-g.s)*100)) + '%';
  if(t >= g.e - 0.02){ audio.pause(); enterGap(); }
}
async function enterGap(){
  const g = segs[shadow.i];
  shadow.phase = 'gap'; $('#shadowCard').classList.add('gap');
  shadow.gapLen = ((g.e-g.s)/S.rate)*S.gap + 0.5; shadow.gapStart = performance.now();
  setShPhase('<span class="you">Jetzt du! Sprich nach.</span>', `Satz ${shadow.i+1} / ${segs.length}`);
  if(S.rec) await startRecording();
  const anim = () => { const p = (performance.now()-shadow.gapStart)/(shadow.gapLen*1000); $('#shBar').style.width = Math.min(100,p*100)+'%'; if(p<1) shadow.raf = requestAnimationFrame(anim); };
  anim();
  shadow.timer = setTimeout(endGap, shadow.gapLen*1000);
}
async function endGap(){
  cancelAnimationFrame(shadow.raf);
  if(S.rec && shadow.rec){
    const blob = await stopRecording();
    if(blob && blob.size > 500){
      shadow.phase = 'own'; setShPhase('Deine Stimme', `Satz ${shadow.i+1} / ${segs.length}`);
      shadow.own = new Audio(URL.createObjectURL(blob)); shadow.own.playsInline = true;

function pauseShadow(){ shadow.paused = true; clearShadowTimers(); stopRecording(true); audio.pause(); setShPhase('Pausiert', `Satz ${shadow.i+1} / ${segs.length}`); setPlayIcon(false); }

async function getMic(){ if(shadow.mic) return shadow.mic; shadow.mic = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); return shadow.mic; }
async function startRecording(){

  const u = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl=${tl}&dt=t&dt=bd&q=${encodeURIComponent(q)}`;
  const r = await fetch(u); if(!r.ok) throw new Error(r.status);

async function decode16k(blob){
  const ab = await blob.arrayBuffer();
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  let buf;
  try{ const oc = new OAC(1, 16000, 16000); buf = await oc.decodeAudioData(ab); }
  catch(e){ const AC = window.AudioContext||window.webkitAudioContext; const c = new AC(); buf = await c.decodeAudioData(await blob.arrayBuffer()); try{ c.close(); }catch(_){} }
  let data;
  if(buf.numberOfChannels === 1) data = buf.getChannelData(0);
  else { const a=buf.getChannelData(0), b=buf.getChannelData(1); data = new Float32Array(a.length); for(let i=0;i<a.length;i++) data[i]=(a[i]+b[i])/2; }
  if(buf.sampleRate !== 16000){ // manual resample fallback
    const ratio = buf.sampleRate/16000, n = Math.floor(data.length/ratio), out = new Float32Array(n);
    for(let i=0;i<n;i++){ const x=i*ratio, j=Math.floor(x), f=x-j; out[i] = data[j]*(1-f) + (data[j+1]||0)*f; }
    data = out;
  }
  return data;
}
function rms(a, s, e){ let t=0; for(let i=s;i<e;i++) t+=a[i]*a[i]; return Math.sqrt(t/Math.max(1,e-s)); }
function nextCut(a, start, target, minLen){
  const SR=16000, end = Math.min(a.length, start + target*SR);
  if(end >= a.length) return a.length;
  const from = start + minLen*SR, win = SR*0.1; let best = end, bestV = Infinity;
  for(let p=end-win; p>from; p-=win/2){ const v = rms(a, p, p+win); if(v < bestV){ bestV=v; best=p+win/2; } }
  return Math.floor(best);
}
function cleanSegs(list){
  const out = [];
  for(const g of list){
    const t = (g.t||'').replace(/\s+/g,' ').trim();
    if(!t || HALLU.test(t) || /^[\s.,!?♪*-]+$/.test(t)) continue;
    if(out.length && out[out.length-1].t === t) continue;
    out.push({s:g.s, e:Math.max(g.e, g.s+0.3), t});
  }
  // split long segments at sentence ends
  const res = [];
  for(const g of out){
    const parts = g.t.match(/[^.!?]+[.!?]+["“”»]?|[^.!?]+$/g) || [g.t];
    if(g.e-g.s < 9 || parts.length < 2){ res.push(g); continue; }
    const tot = g.t.length; let acc = 0;
    parts.forEach(p => { const s = g.s + (g.e-g.s)*acc/tot; acc += p.length; const e = g.s + (g.e-g.s)*acc/tot; if(p.trim()) res.push({s, e, t:p.trim()}); });
  }
  // merge very short ones
  const m = [];
  for(const g of res){ const L = m[m.length-1]; if(L && (g.e-g.s < 1.2 || L.e-L.s < 1.2) && g.s - L.e < 0.8 && (L.e-L.s)+(g.e-g.s) < 14 && !/[.!?]$/.test(L.t)){ L.e = g.e; L.t += ' ' + g.t; } else m.push({...g}); }
  return m;
}

async function runTranscription(restart){
  if(TX.busy) return;
  if(S.method==='openai' && !S.key){ toast('Bitte API-Schlüssel eingeben.'); return; }
  TX.busy = true; TX.stop = false; setBusyUI(true);
  try{ if(navigator.wakeLock) TX.wake = await navigator.wakeLock.request('screen'); }catch(e){}
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{
    if(restart){ segs = []; await persistSegs({tDone:0}); renderTx(); }
    setP(0, 'Audio wird dekodiert…');
    const a = await DB.get('audio', cur.id);
    const pcm = await decode16k(a.blob);
    const total = pcm.length/16000;
    let pos = Math.floor((restart? 0 : (cur.tDone||0)) * 16000);
    if(pos >= pcm.length - 16000){ pos = 0; segs = []; }
    if(S.method==='local') await ensureWorker();
    const target = S.method==='local' ? 28 : 600, minLen = S.method==='local' ? 20 : 480;
    const t0 = performance.now(), startPos = pos;
    while(pos < pcm.length && !TX.stop){
      const end = nextCut(pcm, pos, target, minLen);
      const chunk = pcm.slice(pos, end); const off = pos/16000;
      let got = [];
      if(rms(chunk, 0, chunk.length) > 0.0025){
        if(S.method==='local'){
          const r = await workerCall({type:'run', id:pos, audio:chunk}, [chunk.buffer]);
          got = (r.out.chunks||[]).map(c => ({s: off + (c.timestamp[0]??0), e: off + (c.timestamp[1] ?? (end-pos)/16000), t: c.text}));
          if(!got.length && r.out.text) got = [{s:off, e:end/16000, t:r.out.text}];
        } else {
          got = (await openaiChunk(chunk)).map(g => ({s:g.s+off, e:g.e+off, t:g.t}));
        }
      }
      if(G.auto) got.forEach(g => g.t = fixTerms(g.t||''));
      segs = cleanSegs(segs.concat(got));
      pos = end;
      await persistSegs({tDone: pos/16000, tSource:S.method, tModel:S.model});
      renderTx();
      const done = (pos-startPos)/16000, el = (performance.now()-t0)/1000, left = (total - pos/16000) * el/Math.max(1,done);
      setP(pos/pcm.length, `${fmt(pos/16000)} von ${fmt(total)} fertig — noch ca. ${fmt(left)} (${segs.length} Sätze)`);
    }
    if(TX.stop) setP(null, `Gestoppt bei ${fmt(pos/16000)}. „Fortsetzen“ macht dort weiter.`);
    else { setP(1, `Fertig: ${segs.length} Sätze.`); toast('Transkript fertig. Tippe auf ein Wort für die Bedeutung.', 4000); }
  }catch(err){
    console.error(err);
    const m = String(err.message||err);
    setP(null, 'Fehler: ' + m + (/fetch|network|load/i.test(m) ? ' — Internetverbindung prüfen (für den ersten Modell-Download nötig).' : /memory|allocation|OOM/i.test(m) ? ' — Zu wenig Speicher: Modell „Mittel“ wählen und andere Apps schließen.' : ''));
    if(TX.worker){ TX.worker.terminate(); TX.worker = null; TX.workerModel = null; }
  }finally{
    TX.busy = false; setBusyUI(false);
    try{ TX.wake && TX.wake.release(); }catch(e){} TX.wake = null;
    const go = $('#goTx'); if(go && cur.tDone < (cur.duration||0) - 1) go.textContent = 'Fortsetzen';
  }
}

const gnorm = w => w.toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}]/gu,'');
let GX = null;
function buildGloss(){
  const terms = G.terms.split('\n').map(t=>t.trim()).filter(t=>t && !t.startsWith('#'));
  const exact = new Map(); const long = [];
  terms.forEach(t => { const k = gnorm(t); if(!k) return; exact.set(k, t); if(k.length >= 8) long.push([k,t]); });
  const rules = G.rules.split('\n').map(l=>l.trim()).filter(l=>l && !l.startsWith('#') && l.includes('=>')).map(l => { const [a,b] = l.split('=>').map(x=>x.trim()); return [a,b]; }).filter(r=>r[0]&&r[1]);

}
buildGloss();
function lev(a,b,max){ if(Math.abs(a.length-b.length)>max) return max+1; let prev = Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){ const cur=[i]; let rowMin=i; for(let j=1;j<=b.length;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); rowMin=Math.min(rowMin,cur[j]); } if(rowMin>max) return max+1; prev=cur; } return prev[b.length]; }
function fixTerms(text){
  if(!text) return text;
  let t = text;
  for(const [a,b] of GX.rules){
    const re = new RegExp('(^|[^\\p{L}\\p{N}])' + a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'[\\s-]+') + '(?=$|[^\\p{L}\\p{N}])', 'giu');

  }
  const tok = t.split(/\s+/).filter(Boolean); const out = [];
  for(let i=0;i<tok.length;){
    let done = false;
    for(let k=Math.min(4, tok.length-i); k>=1 && !done; k--){
      const win = tok.slice(i,i+k); const last = win[k-1];
      const tail = (last.match(/[^\p{L}\p{N}]+$/u)||[''])[0];
      const lead = (win[0].match(/^[^\p{L}\p{N}]+/u)||[''])[0];
      const key = gnorm(win.join(''));
      if(!key) continue;
      let term = GX.exact.get(key);
      if(!term && key.length >= 8 && k <= 2){
        const maxD = key.length >= 12 ? 2 : 1;
        for(const [tk, tt] of GX.long){
          if(tk[0] !== key[0] || tk.startsWith(key) || key.startsWith(tk)) continue;
          if(lev(key, tk, maxD) <= maxD){ term = tt; break; }

function learnRule(oldT, newT){
  const a = oldT.split(/\s+/), b = newT.split(/\s+/);
  const c = w => gnorm(w);
  let p = 0; while(p < a.length && p < b.length && c(a[p])===c(b[p])) p++;
  let q = 0; while(q < a.length-p && q < b.length-p && c(a[a.length-1-q])===c(b[b.length-1-q])) q++;
  const A = a.slice(p, a.length-q), B = b.slice(p, b.length-q);
  if(!A.length || !B.length || A.length > 3 || B.length > 3) return null;
  const from = A.join(' ').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,''), to = B.join(' ').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'');

  G.rules = G.rules.replace(/\s*$/,'') + `\n${from} => ${to}`; saveG();

}

  {de:'Perfekt: haben / sein … ge…t', fa:'گذشتهٔ نقلی: haben/sein + Partizip II', re:/\b(habe|hast|hat|haben|habt|ist|sind|bin|bist|seid)\b.{0,60}\bge\w{2,}(t|en)\b/i},
  {de:'Es gibt … / Gibt es …?', fa:'… وجود دارد / آیا … هست؟', re:/\bes gibt\b|\bgibt es\b/i},
  {de:'Höflich: könnten / würden / hätten', fa:'حالت مؤدبانه (Konjunktiv II)', re:/\b(könnten|könntest|würden|würde|würdest|hätte|hätten|wäre|wären)\b/i},
 ]},
];
function structsIn(text){ const out = []; STRUCTS.forEach(c => c.items.forEach(it => { if(it.re.test(text)) out.push(it); })); return out; }
function markHit(text, re){ const m = text.match(re); if(!m) return esc(text); const i = m.index; return esc(text.slice(0,i)) + '<mark>' + esc(m[0]) + '</mark>' + esc(text.slice(i + m[0].length)); }
let stOnlyFound = false;
async function renderStructs(){
  const recs = await DB.all('recs'); const mine = (await DB.all('vocab')).filter(v => v.kind==='satz').sort((a,b)=>b.added-a.added);
  const all = []; recs.forEach(r => (r.segments||[]).forEach(g => all.push({t:g.t, s:g.s, id:r.id, name:r.name})));
  const el = $('#structList');
  let html = `<p class="fa note">ساختارهای مهم جلسه از جزوهٔ Meeting-Deutsch خودت. زیر هر کدام، جمله‌های واقعی از میتینگ‌هایت می‌آید؛ ▶ همان لحظه را پخش می‌کند.</p>
    <div class="row" style="margin:8px 0 4px"><button class="chip" id="stFound" aria-pressed="${stOnlyFound}">Nur in meinen Meetings gefundene</button><span class="note">${all.length} Sätze durchsucht</span></div>`;
  if(mine.length){
    html += `<h3 class="st-cat">Meine Sätze</h3>` + mine.map(m => `<div class="st"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="pat" style="font-weight:400">${esc(m.word)}</div><span><button class="icon" data-say="${esc(m.word)}">🔊</button><button class="icon" data-del="${m.id}">✕</button></span></div>
      <div class="hit" style="border:0;padding-top:0"><button data-go="${m.recId}" data-t="${m.time}">▶︎</button><div><small>${esc(m.recName||'')} ${fmt(m.time||0)}</small><button class="linkbtn" data-tr="${esc(m.word)}" style="font-size:13px;padding:0">Übersetzen</button><div class="fa" data-trout></div></div></div></div>`).join('');
  }
  STRUCTS.forEach(c => {
    const cards = c.items.map(it => {
      const hits = all.filter(x => it.re.test(x.t));
      if(stOnlyFound && !hits.length) return '';
      return `<div class="st ${hits.length?'':'none'}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div class="pat">${esc(it.de)}</div><span class="cnt">${hits.length}×</span></div>
        <div class="fa">${esc(it.fa)}</div>
        ${hits.slice(0,4).map(h => `<div class="hit"><button data-go="${h.id}" data-t="${h.s}" aria-label="Abspielen">▶︎</button><div><small>${esc(h.name)} ${fmt(h.s)}</small>${markHit(h.t, it.re)}</div></div>`).join('')}
        ${hits.length>4?`<div class="note" style="margin-top:6px">+ ${hits.length-4} weitere</div>`:''}</div>`;
    }).join('');
    if(cards.trim()) html += `<h3 class="st-cat">${esc(c.cat)}</h3>` + cards;
  });
  if(!all.length) html += `<div class="empty" style="margin-top:14px">Noch keine Transkripte. Sobald eine Aufnahme ein Transkript hat, erscheinen hier echte Beispiele aus deinen Meetings.</div>`;
  el.innerHTML = html;
}
$('#structList').addEventListener('click', async e => {
  const t = e.target;
  if(t.closest('#stFound')){ stOnlyFound = !stOnlyFound; renderStructs(); return; }
  const go = t.closest('[data-go]');
  if(go){ await openRec(go.dataset.go); const s = +go.dataset.t; const once = () => { audio.currentTime = s; play(); }; if(audio.readyState >= 1) once(); else audio.addEventListener('loadedmetadata', once, {once:true}); return; }
  const sy = t.closest('[data-say]'); if(sy){ say(sy.dataset.say, 0.9); return; }
  const dl = t.closest('[data-del]'); if(dl){ await DB.del('vocab', dl.dataset.del); renderStructs(); return; }
  const tr = t.closest('[data-tr]'); if(tr){ const out = tr.parentElement.querySelector('[data-trout]'); out.textContent = '…'; const r = await translate(tr.dataset.tr, 'fa'); out.textContent = r?.text || 'Übersetzung nicht verfügbar.'; }
});

/* ---------- paste a transcript (e.g. from Voice Memos) ---------- */
function openPasteSheet(){
  const has = segs.length > 0;
  const hasAlt = segs.some(g => g.alt);
  openSheet(`
    <h3>Text einfügen</h3>
    <p class="note">In Sprachmemos: Aufnahme öffnen → Transkript anzeigen → Text kopieren. Dann hier lange tippen → „Einsetzen“.</p>
    <textarea id="pt" rows="8" placeholder="Transkript hier einsetzen…"></textarea>
    ${has ? `
    <h4>Wie verwenden?</h4>
    <label class="opt"><input type="radio" name="pm" value="compare" checked><span><b>Als Vergleich unter jedem Satz</b><small>Empfohlen. Die Whisper-Zeiten bleiben. Unter jedem Satz steht die Sprachmemos-Version; mit „übernehmen“ nimmst du die bessere.</small></span></label>
    <label class="opt"><input type="radio" name="pm" value="replace"><span><b>Text komplett ersetzen</b><small>Die Zeiten von Whisper bleiben, der Text kommt aus Sprachmemos.</small></span></label>`
    : `<p class="note" style="margin-top:10px">Noch kein Whisper-Transkript: Die Zeiten werden nur geschätzt, Shadowing ist dann ungenau. Besser: zuerst „Transkript erstellen“, dann hier einfügen und vergleichen.</p>`}
    <button class="primary" id="ptGo" style="margin-top:12px">Text verwenden</button>
    ${hasAlt ? '<button class="secondary" id="ptClear" style="margin-top:10px;width:100%">Vergleich entfernen</button>' : ''}`, sh => {
    sh.querySelector('#ptGo').onclick = async () => {
      const text = sh.querySelector('#pt').value.trim();
      if(text.length < 5){ toast('Bitte zuerst Text einsetzen.'); return; }
      if(!segs.length){
        const out = parseSubs(text, audio.duration || cur.duration);
        if(!out.length){ toast('Keine Sätze gefunden.'); return; }
        segs = out; await persistSegs({tDone: cur.duration, tSource:'paste'});
        renderTx(); closeSheet(); toast(`${out.length} Sätze eingefügt (Zeiten geschätzt).`); return;
      }
      const mode = sh.querySelector('input[name=pm]:checked').value;
      const per = alignToSegs(segs, text).map(x => x && G.auto ? fixTerms(x) : x);
      let n = 0;
      segs.forEach((g,i) => { if(!per[i]) return; n++; if(mode==='replace') g.t = per[i]; else g.alt = per[i]; });
      if(mode==='replace') segs.forEach(g => delete g.alt);
      await persistSegs(); renderTx(); closeSheet();
      toast(mode==='replace' ? `Text in ${n} Sätzen ersetzt.` : `Vergleich für ${n} Sätze hinzugefügt.`, 3500);
    };
    const c = sh.querySelector('#ptClear');
    if(c) c.onclick = async () => { segs.forEach(g => delete g.alt); await persistSegs(); renderTx(); closeSheet(); };
  });
}
/* word alignment (banded Needleman–Wunsch) between Whisper words and pasted words */
function alignToSegs(list, text){
  const norm = w => w.toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}]/gu,'');
  const A = []; list.forEach((g,si) => g.t.split(/\s+/).forEach(w => { const k = norm(w); if(k) A.push({k, si}); }));
  const Braw = text.replace(/\[?\d{1,2}:\d{2}(?::\d{2})?\]?/g,' ').split(/\s+/).filter(w => norm(w));
  const B = Braw.map(norm);
  const n = A.length, m = B.length;
  const out = new Array(list.length).fill('');
  if(!n || !m) return out;
  const sim = (a,b) => { if(a===b) return 3; const L = Math.min(a.length,b.length); if(L>=4 && a.slice(0,4)===b.slice(0,4)) return 1; return -1; };
  const W = Math.min(Math.max(60, Math.ceil(Math.abs(n-m)) + 60), 500), BW = 2*W+1;
  const H = new Float32Array((n+1)*BW).fill(-1e9), D = new Uint8Array((n+1)*BW); // 1 diag, 2 up(skip A), 3 left(skip B)
  const cj = i => Math.round(i*m/n);
  const idx = (i,j) => { const o = j - cj(i) + W; return (o<0||o>=BW) ? -1 : i*BW+o; };
  for(let j=0;j<=Math.min(m,W);j++){ const k = idx(0,j); if(k>=0){ H[k] = -j; D[k] = 3; } }
  for(let i=1;i<=n;i++){
    const c = cj(i);
    for(let j=Math.max(0,c-W); j<=Math.min(m,c+W); j++){
      const k = idx(i,j); let best = -1e9, dir = 0, t;
      if(j>0){ const kd = idx(i-1,j-1); if(kd>=0 && (t = H[kd] + sim(A[i-1].k, B[j-1])) > best){ best=t; dir=1; } }
      const ku = idx(i-1,j); if(ku>=0 && (t = H[ku] - 1) > best){ best=t; dir=2; }
      if(j>0){ const kl = idx(i,j-1); if(kl>=0 && (t = H[kl] - 1) > best){ best=t; dir=3; } }
      H[k] = best; D[k] = dir;
    }
  }
  // traceback
  const segOfB = new Int32Array(m).fill(-1);
  let i = n, j = m, guard = 0;
  if(idx(n,m) < 0){ j = Math.min(m, cj(n)+W); }
  while(i>0 && j>0 && guard++ < (n+m)*2){
    const k = idx(i,j); const d = k>=0 ? D[k] : 2;
    if(d===1){ segOfB[j-1] = A[i-1].si; i--; j--; }
    else if(d===2){ i--; }
    else { j--; }
  }
  // unaligned pasted words follow the previous aligned word (or the next one at the start)
  let last = -1; for(let q=0;q<m;q++){ if(segOfB[q]>=0) last = segOfB[q]; else segOfB[q] = last; }
  let nxt = 0; for(let q=m-1;q>=0;q--){ if(segOfB[q]>=0) nxt = segOfB[q]; else segOfB[q] = nxt; }
  Braw.forEach((w,q) => { const si = segOfB[q]; out[si] = out[si] ? out[si] + ' ' + w : w; });
  return out;
}

/* subtitles import/export */
function parseTime(s){ const m = s.trim().replace(',', '.').split(':').map(Number); return m.length===3 ? m[0]*3600+m[1]*60+m[2] : m[0]*60+m[1]; }
function parseSubs(text, dur){
  const out = []; const re = /(\d{1,2}:\d{2}(?::\d{2})?[.,]\d{1,3})\s*-->\s*(\d{1,2}:\d{2}(?::\d{2})?[.,]\d{1,3})[^\n]*\n([\s\S]*?)(?=\n\s*\n|$)/g; let m;
  while((m = re.exec(text.replace(/\r/g,'')))) out.push({s:parseTime(m[1]), e:parseTime(m[2]), t:m[3].replace(/<[^>]+>/g,'').replace(/\n/g,' ').trim()});
  if(out.length) return cleanSegs(out);
  // plain text with [mm:ss] stamps?
  const lines = text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const st = lines.map(l => { const k = l.match(/^\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?\s*(.*)$/); return k ? {s:parseTime(k[1]+'.0'), t:k[2]} : null; });
  if(st.every(Boolean)) return cleanSegs(st.map((g,i)=>({s:g.s, e: st[i+1]? st[i+1].s : (dur||g.s+5), t:g.t})));
  // plain text without timings: spread by length (approximate)
  const sents = text.replace(/\s+/g,' ').match(/[^.!?]+[.!?]*/g) || [];
  const tot = sents.reduce((a,s)=>a+s.length,0); let acc = 0; const D = dur || tot/15;
  return sents.map(s => { const a = acc; acc += s.length; return {s:D*a/tot, e:D*acc/tot, t:s.trim()}; }).filter(g=>g.t);
}
function toSrt(list){ const T = t => { const ms = Math.round(t*1000); const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000), x=ms%1000; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(x).padStart(3,'0')}`; }; return list.map((g,i)=>`${i+1}\n${T(g.s)} --> ${T(g.e)}\n${g.t}\n`).join('\n'); }

/* lock-screen controls */
function setupMediaSession(){
  if(!('mediaSession' in navigator) || !cur) return;
  navigator.mediaSession.metadata = new MediaMetadata({title: cur.name, artist:'Hören-Trainer'});
  const h = (a,f) => { try{ navigator.mediaSession.setActionHandler(a,f); }catch(e){} };
  h('play', ()=>play()); h('pause', ()=>audio.pause());
  h('seekbackward', ()=>nudge(-10)); h('seekforward', ()=>nudge(10));
}
